name: Docksmith Permanu CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      lane:
        description: Explicit CI lane to run manually.
        required: true
        type: choice
        default: pr
        options:
          - pr
          - main
          - release
          - all

permissions:
  contents: write
  checks: write
  statuses: write
  pull-requests: read

concurrency:
  group: docksmith-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  version-guard:
    name: permanu-ci / docksmith / version-guard
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'pr' || inputs.lane == 'main' || inputs.lane == 'release' || inputs.lane == 'all')) }}
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository checkout and release bump path
        run: |
          set -euo pipefail
          test -f go.mod
          test -f .goreleaser.yml
          grep -q '^module github.com/permanu/docksmith$' go.mod
          git fetch --tags --force
          latest_tag=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -n "$latest_tag" ]; then
            next=$(awk -v v="${latest_tag#v}" 'BEGIN { split(v, p, "."); printf "v%d.%d.%d", p[1], p[2], p[3] + 1 }')
            if git rev-parse "$next" >/dev/null 2>&1; then
              echo "next release tag $next already exists"
              exit 1
            fi
            printf '%s\n' "$next" > .permanu-next-version
            echo "next_release=$next"
          else
            printf '%s\n' "v0.1.0" > .permanu-next-version
            echo "next_release=v0.1.0"
          fi

      - name: Upload version guard artifact
        uses: actions/upload-artifact@v4
        with:
          name: docksmith-version-guard
          path: .permanu-next-version
          retention-days: 14

  go-quality:
    name: permanu-ci / docksmith / go-quality
    needs: [version-guard]
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'pr' || inputs.lane == 'main' || inputs.lane == 'release' || inputs.lane == 'all')) }}
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go toolchain guard
        run: |
          set -euo pipefail
          go version
          required=$(awk '/^go / {print $2}' go.mod)
          actual=$(go env GOVERSION | sed 's/^go//')
          echo "required_go=$required"
          echo "actual_go=$actual"
          awk -v actual="$actual" -v required="$required" 'BEGIN { split(actual,a,"."); split(required,r,"."); if ((a[1] < r[1]) || (a[1] == r[1] && a[2] < r[2])) exit 1 }'

      - name: Dependency download
        run: |
          set -euo pipefail
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "go.mod/go.sum changed after go mod tidy; commit the module graph before CI can release."
            exit 1
          fi
          go mod download all

      - name: Build
        run: GOFLAGS=-mod=readonly go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format guard
        run: |
          set -euo pipefail
          changed=$(gofmt -l .)
          if [ -n "$changed" ]; then
            echo "Files need gofmt:"
            echo "$changed"
            exit 1
          fi

      - name: Race tests with coverage
        run: |
          set -euo pipefail
          go list ./... | grep -v '^github.com/permanu/docksmith/examples/' | xargs go test -race -count=1 -coverprofile=cover.out
          total=$(go tool cover -func=cover.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "Coverage: ${total}%"
          awk -v total="$total" 'BEGIN { if (total < 40) exit 1 }'

      - name: Vulnerability scan
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: docksmith-coverage
          path: cover.out
          retention-days: 14

  main-release-readiness:
    name: permanu-ci / docksmith / main-release-readiness
    needs: [go-quality]
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'main' || inputs.lane == 'all')) }}
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GoReleaser config
        run: go run github.com/goreleaser/goreleaser/v2@latest check

      - name: Build release artifact set
        run: |
          set -euo pipefail
          rm -rf dist
          version=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || echo v0.0.0)
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              out="dist/docksmith_${os}_${arch}"
              bin="docksmith"
              if [ "$os" = windows ]; then bin="docksmith.exe"; fi
              tmp="$(mktemp -d)"
              GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${version} -X main.commit=$(git rev-parse --short HEAD)" -o "$tmp/$bin" ./cmd/docksmith
              if [ "$os" = windows ]; then
                (cd "$tmp" && zip -q "../docksmith_${os}_${arch}.zip" "$bin")
                mv "$tmp/../docksmith_${os}_${arch}.zip" "${out}.zip"
              else
                tar -C "$tmp" -czf "${out}.tar.gz" "$bin"
              fi
              rm -rf "$tmp"
            done
          done
          (cd dist && sha256sum * > checksums.txt)

      - name: Upload release preview
        uses: actions/upload-artifact@v4
        with:
          name: docksmith-release-preview
          path: dist/
          retention-days: 14

  github-release:
    name: permanu-ci / docksmith / github-release
    needs: [go-quality]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          go run github.com/goreleaser/goreleaser/v2@latest release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
